<!DOCTYPE html>
<html lang="es" data-theme="clasico">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navidad Mágica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Capa oscura semitransparente sobre el fondo de gradiente -->
<div class="overlay" aria-hidden="true"></div>

<!-- ═══════════════════════════════════════════════════════════
     MENSAJE DE LLEGADA — aparece cuando el contador llega a 0
════════════════════════════════════════════════════════════ -->
<div class="arrival-overlay" id="arrival-overlay" aria-hidden="true"
     role="dialog" aria-modal="true" aria-labelledby="arrival-heading">
    <div class="arrival-content">
        <span class="arrival-emoji" id="arrival-emoji" aria-hidden="true">🎄</span>
        <h2 class="arrival-title" id="arrival-heading">¡Feliz Navidad!</h2>
        <p class="arrival-subtitle">Que esta noche sea llena de magia, amor y alegría ✨</p>
        <button class="btn btn-primary arrival-btn" id="close-arrival">
            🎊 ¡Celebrar!
        </button>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     CONTENEDOR PRINCIPAL
════════════════════════════════════════════════════════════ -->
<div class="container">

    <!-- Luces navideñas generadas por JS.
         FIX: ahora usan position:fixed en CSS para anclarse al viewport
         real y no desaparecer bajo el chrome del navegador en móvil. -->
    <div class="lights" aria-hidden="true"></div>

    <!-- Título central — aparece al presionar Power -->
    <h1 id="christmas-title" aria-live="polite">Felices Fiestas</h1>

    <!-- ─────────────── PANEL GLASSMORPHISM ─────────────── -->
    <div class="glass-panel">

        <!-- NUEVO: Selector de temas -->
        <div class="theme-selector" role="group" aria-label="Tema de color">
            <button class="theme-btn active" data-theme="clasico" title="Clásico">🎄</button>
            <button class="theme-btn"        data-theme="hielo"   title="Hielo">❄️</button>
            <button class="theme-btn"        data-theme="dorado"  title="Dorado">⭐</button>
            <button class="theme-btn"        data-theme="magico"  title="Mágico">🔮</button>
        </div>

        <!-- Countdown regresivo -->
        <div id="countdown" aria-label="Cuenta regresiva a Navidad">
            <div class="time-box"><span id="days">00</span><p>DÍAS</p></div>
            <div class="separator" aria-hidden="true">:</div>
            <div class="time-box"><span id="hours">00</span><p>HRS</p></div>
            <div class="separator" aria-hidden="true">:</div>
            <div class="time-box"><span id="minutes">00</span><p>MIN</p></div>
            <div class="separator" aria-hidden="true">:</div>
            <div class="time-box"><span id="seconds">00</span><p>SEG</p></div>
        </div>

        <div class="message">
            Falta poco para <span class="christmas-text">Navidad</span>
        </div>

        <!-- NUEVO: Control de volumen — oculto por defecto, aparece con Power ON -->
        <div class="volume-control" id="volume-control">
            <span class="vol-icon" aria-hidden="true">🔈</span>
            <input type="range" id="volume-slider" min="0" max="100" value="15"
                   aria-label="Volumen de la música">
            <span class="vol-icon" aria-hidden="true">🔊</span>
        </div>

        <!-- Botones principales -->
        <div class="controls">
            <button id="on-off-button" class="btn btn-primary" aria-pressed="false">
                <span class="icon" aria-hidden="true">⭕</span> Power
            </button>
            <button id="motion-button" class="btn btn-secondary">
                <span class="icon" aria-hidden="true">✨</span> Modos
            </button>
        </div>

        <!-- NUEVO: Intensidad de nieve -->
        <div class="extra-controls">
            <button id="snow-button" class="btn btn-ghost">
                🌨️&nbsp;Nieve:&nbsp;<span id="snow-label">Normal</span>
            </button>
        </div>

    </div><!-- /.glass-panel -->

</div><!-- /.container -->

<audio id="Audio" preload="auto" loop>
    <source src="luces_navideñas.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
